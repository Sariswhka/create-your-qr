            measurementId: "${{ secrets.TADDA_FIREBASE_MEASUREMENT_ID }}"
          };
          firebase.initializeApp(firebaseConfig);
          window.ADMIN_EMAIL = "${{ secrets.TADDA_ADMIN_EMAIL }}";
          window.WEB3FORMS_KEY = "${{ secrets.WEB3FORMS_KEY }}";
          EOF

      - name: Deploy to Firebase
        run: |
          echo '${{ secrets.GCP_SA_KEY_TADDA }}' > sa-key.json
          GOOGLE_APPLICATION_CREDENTIALS=sa-key.json firebase deploy --only hosting --project tadda-81f3e
        working-directory: ./tadda

  deploy-tadda-web:
