name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-qr-code:
    name: Deploy QR Code Generator
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(toJson(github.event.commits), 'qr-code/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Generate config.js
        run: |
          mkdir -p qr-code/public/js
          cat > qr-code/public/js/config.js << 'EOF'
          const firebaseConfig = {
            apiKey: "${{ secrets.FIREBASE_API_KEY }}",
            authDomain: "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
            projectId: "${{ secrets.FIREBASE_PROJECT_ID }}",
            storageBucket: "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
            messagingSenderId: "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
            appId: "${{ secrets.FIREBASE_APP_ID }}",
            measurementId: "${{ secrets.FIREBASE_MEASUREMENT_ID }}"
          };
          firebase.initializeApp(firebaseConfig);

          const EMAILJS_PUBLIC_KEY = "${{ secrets.EMAILJS_PUBLIC_KEY }}";
          const EMAILJS_SERVICE_ID = "${{ secrets.EMAILJS_SERVICE_ID }}";
          const EMAILJS_TEMPLATE_ID = "${{ secrets.EMAILJS_TEMPLATE_ID }}";
          emailjs.init(EMAILJS_PUBLIC_KEY);

          window.GEMINI_API_KEY = "${{ secrets.GEMINI_API_KEY }}";
          EOF

      - name: Deploy to Firebase
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > sa-key.json
          GOOGLE_APPLICATION_CREDENTIALS=sa-key.json firebase deploy --only hosting --project create-your-qr
        working-directory: ./qr-code

  deploy-image-resizer:
