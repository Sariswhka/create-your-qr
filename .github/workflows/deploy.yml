      - name: Deploy to Firebase
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > sa-key.json
          GOOGLE_APPLICATION_CREDENTIALS=sa-key.json firebase deploy --only hosting --project create-your-qr
        working-directory: ./image-resizer

  deploy-ems-tools:
    name: Deploy EMS Tools
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
