<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tadda — Print on Demand & Bulk Clothing Orders</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-page" id="loginPage">
    <div class="login-card">
        <div class="login-logo">
            <h1>Tadd<span>a</span></h1>
            <p>Print on Demand & Bulk Clothing Orders</p>
        </div>

        <div id="errorMsg" class="error-msg"></div>

        <!-- Google Sign In -->
        <button class="btn-google" id="googleBtn">
            <svg width="18" height="18" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continue with Google
        </button>

        <div class="divider">or</div>

        <!-- Email/Password -->
        <div id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="authEmail" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="authPassword" placeholder="••••••••">
            </div>
            <button class="btn btn-primary btn-full btn-lg" id="loginBtn">Sign In</button>
            <div class="auth-toggle">Don't have an account? <a onclick="toggleAuthMode()">Sign Up</a></div>
        </div>

        <div id="signupForm" class="hidden">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="signupName" placeholder="Your name">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="signupEmail" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signupPassword" placeholder="Min 6 characters">
            </div>
            <button class="btn btn-primary btn-full btn-lg" id="signupBtn">Create Account</button>
            <div class="auth-toggle">Already have an account? <a onclick="toggleAuthMode()">Sign In</a></div>
        </div>
    </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script>
const auth = firebase.auth();
const db   = firebase.firestore();
let isSignupMode = false;

function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
}

function toggleAuthMode() {
    isSignupMode = !isSignupMode;
    document.getElementById('loginForm').classList.toggle('hidden', isSignupMode);
    document.getElementById('signupForm').classList.toggle('hidden', !isSignupMode);
    document.getElementById('errorMsg').style.display = 'none';
}

document.getElementById('googleBtn').addEventListener('click', async () => {
    try {
        await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
    } catch (e) { showError(e.message); }
});

document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('authEmail').value.trim();
    const pass  = document.getElementById('authPassword').value;
    if (!email || !pass) { showError('Please fill in all fields.'); return; }
    try {
        await auth.signInWithEmailAndPassword(email, pass);
    } catch (e) { showError('Invalid email or password.'); }
});

document.getElementById('signupBtn').addEventListener('click', async () => {
    const name  = document.getElementById('signupName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const pass  = document.getElementById('signupPassword').value;
    if (!name || !email || !pass) { showError('Please fill in all fields.'); return; }
    if (pass.length < 6) { showError('Password must be at least 6 characters.'); return; }
    try {
        const cred = await auth.createUserWithEmailAndPassword(email, pass);
        await cred.user.updateProfile({ displayName: name });
        await db.collection('users').doc(cred.user.uid).set({
            displayName: name, email, role: 'customer',
            walletBalance: 0, createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
    } catch (e) { showError(e.message); }
});

auth.onAuthStateChanged(async user => {
    if (!user) return;
    const doc = await db.collection('users').doc(user.uid).get();
    const role = doc.exists ? doc.data().role : 'customer';
    if (role === 'admin' || user.email === window.ADMIN_EMAIL) {
        window.location.href = '/admin.html';
    } else if (role === 'franchise') {
        window.location.href = '/franchise.html';
    } else {
        window.location.href = '/dashboard.html';
    }
});
</script>
</body>
</html>
