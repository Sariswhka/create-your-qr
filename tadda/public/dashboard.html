<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders — Tadda</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
    <a href="/dashboard.html" class="brand">Tadd<span>a</span></a>
    <nav class="header-nav">
        <a href="/dashboard.html" class="nav-link active">My Orders</a>
        <a href="/order.html" class="nav-link">+ New Order</a>
        <div class="user-avatar" id="userAvatar">?</div>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">Logout</button>
    </nav>
</header>

<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-section">Menu</div>
        <a href="/dashboard.html" class="sidebar-item active">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            Dashboard
        </a>
        <a href="/order.html" class="sidebar-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New Order
        </a>
        <div class="sidebar-section" style="margin-top:8px">Account</div>
        <a href="#" class="sidebar-item" id="sidebarLogout">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Logout
        </a>
    </aside>

    <main class="main-area">
        <!-- Welcome + Stats -->
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px">
            <div>
                <h2 id="welcomeMsg">Welcome back!</h2>
                <p style="color:var(--muted);font-size:0.85rem;margin-top:2px">Here's your order overview</p>
            </div>
            <a href="/order.html" class="btn btn-primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Place New Order
            </a>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><div class="stat-label">Total Orders</div><div class="stat-value blue" id="statTotal">—</div></div>
            <div class="stat-card"><div class="stat-label">Pending</div><div class="stat-value amber" id="statPending">—</div></div>
            <div class="stat-card"><div class="stat-label">In Production</div><div class="stat-value" style="color:var(--primary)" id="statProduction">—</div></div>
            <div class="stat-card"><div class="stat-label">Delivered</div><div class="stat-value green" id="statDelivered">—</div></div>
        </div>

        <!-- Orders Table -->
        <div class="table-card">
            <div class="table-toolbar">
                <strong id="ordersTitle">My Orders</strong>
                <select id="statusFilter" onchange="filterOrders()" style="font-size:0.82rem;padding:6px 10px;border:1px solid var(--border);border-radius:6px">
                    <option value="">All Status</option>
                    <option value="pending">Pending</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="production">In Production</option>
                    <option value="dispatched">Dispatched</option>
                    <option value="delivered">Delivered</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
            <div id="ordersBody"><div style="padding:32px;text-align:center;color:var(--muted)">Loading orders…</div></div>
        </div>
    </main>
</div>

<!-- Order Detail Modal -->
<div class="modal-overlay hidden" id="orderModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3 id="modalOrderId">Order Details</h3>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div id="modalContent"></div>
    </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script>
const auth = firebase.auth();
const db   = firebase.firestore();
let allOrders = [];
let currentUser = null;

auth.onAuthStateChanged(async user => {
    if (!user) { window.location.href = '/'; return; }
    currentUser = user;
    document.getElementById('userAvatar').textContent = (user.displayName || user.email || '?')[0].toUpperCase();
    document.getElementById('welcomeMsg').textContent = `Welcome back, ${user.displayName || user.email}!`;
    await loadOrders(user.uid);
});

document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut().then(() => window.location.href = '/'));
document.getElementById('sidebarLogout').addEventListener('click', () => auth.signOut().then(() => window.location.href = '/'));

async function loadOrders(uid) {
    const snap = await db.collection('orders').where('userId','==',uid).orderBy('createdAt','desc').get();
    allOrders = snap.docs.map(d => d.data());

    const counts = { pending:0, confirmed:0, production:0, dispatched:0, delivered:0 };
    allOrders.forEach(o => { if (counts[o.status] !== undefined) counts[o.status]++; });

    document.getElementById('statTotal').textContent      = allOrders.length;
    document.getElementById('statPending').textContent    = counts.pending;
    document.getElementById('statProduction').textContent = counts.production;
    document.getElementById('statDelivered').textContent  = counts.delivered;
    document.getElementById('ordersTitle').textContent    = `${allOrders.length} Order${allOrders.length !== 1 ? 's' : ''}`;

    renderOrders(allOrders);
}

function filterOrders() {
    const status = document.getElementById('statusFilter').value;
    renderOrders(status ? allOrders.filter(o => o.status === status) : allOrders);
}

function renderOrders(orders) {
    if (!orders.length) {
        document.getElementById('ordersBody').innerHTML = `
            <div style="padding:48px;text-align:center;color:var(--muted)">
                <div style="font-size:2.5rem;margin-bottom:12px">📦</div>
                <p>No orders yet.</p>
                <a href="/order.html" class="btn btn-primary" style="margin-top:16px">Place Your First Order</a>
            </div>`;
        return;
    }
    const rows = orders.map(o => `
        <tr style="cursor:pointer" onclick="openModal('${o.orderId}')">
            <td><strong>${o.orderId}</strong></td>
            <td>${o.brandName}</td>
            <td>${productLabel(o.product)}</td>
            <td>${o.totalQty}</td>
            <td>${o.colour}</td>
            <td><span class="badge badge-${o.status}">${statusLabel(o.status)}</span></td>
            <td>${o.dispatchEta}</td>
            <td>${fmtDate(o.createdAt)}</td>
        </tr>`).join('');
    document.getElementById('ordersBody').innerHTML = `
        <table>
            <thead><tr><th>Order ID</th><th>Brand</th><th>Product</th><th>Qty</th><th>Colour</th><th>Status</th><th>ETA</th><th>Date</th></tr></thead>
            <tbody>${rows}</tbody>
        </table>`;
}

function openModal(orderId) {
    const o = allOrders.find(x => x.orderId === orderId);
    if (!o) return;
    document.getElementById('modalOrderId').textContent = `Order: ${orderId}`;
    document.getElementById('modalContent').innerHTML = `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:0.85rem">
            <div><span style="color:var(--muted);font-size:0.75rem;text-transform:uppercase;font-weight:700">Status</span><br><span class="badge badge-${o.status}" style="margin-top:4px;display:inline-block">${statusLabel(o.status)}</span></div>
            <div><span style="color:var(--muted);font-size:0.75rem;text-transform:uppercase;font-weight:700">Brand</span><br>${o.brandName}</div>
            <div><span style="color:var(--muted);font-size:0.75rem;text-transform:uppercase;font-weight:700">Product</span><br>${productLabel(o.product)}</div>
            <div><span style="color:var(--muted);font-size:0.75rem;text-transform:uppercase;font-weight:700">Colour</span><br>${o.colour}</div>
            <div><span style="color:var(--muted);font-size:0.75rem;text-transform:uppercase;font-weight:700">Total Qty</span><br>${o.totalQty}</div>
            <div><span style="color:var(--muted);font-size:0.75rem;text-transform:uppercase;font-weight:700">Dispatch ETA</span><br>${o.dispatchEta}</div>
            <div><span style="color:var(--muted);font-size:0.75rem;text-transform:uppercase;font-weight:700">Sizes</span><br>${Object.entries(o.sizes).filter(([,v])=>v>0).map(([k,v])=>`${k}:${v}`).join(', ')}</div>
            <div><span style="color:var(--muted);font-size:0.75rem;text-transform:uppercase;font-weight:700">Shipping</span><br>${o.shipping === 'self' ? 'Self managed' : 'Arranged by Tadda'}</div>
            <div style="grid-column:1/-1"><span style="color:var(--muted);font-size:0.75rem;text-transform:uppercase;font-weight:700">Placement</span><br>${o.placementDetails}</div>
            <div style="grid-column:1/-1"><span style="color:var(--muted);font-size:0.75rem;text-transform:uppercase;font-weight:700">Design Size</span><br>${o.designSize}</div>
            ${o.notes ? `<div style="grid-column:1/-1"><span style="color:var(--muted);font-size:0.75rem;text-transform:uppercase;font-weight:700">Notes</span><br>${o.notes}</div>` : ''}
        </div>
        <div style="margin-top:16px;display:flex;flex-wrap:wrap;gap:10px">
            ${o.designUrl ? `<a href="${o.designUrl}" target="_blank" class="btn btn-ghost btn-sm">🎨 View Design</a>` : ''}
            ${o.mockupUrl ? `<a href="${o.mockupUrl}" target="_blank" class="btn btn-ghost btn-sm">🖼️ View Mockup</a>` : ''}
            ${o.neckLabelUrl ? `<a href="${o.neckLabelUrl}" target="_blank" class="btn btn-ghost btn-sm">👕 Neck Label</a>` : ''}
            ${o.shippingLabelUrl ? `<a href="${o.shippingLabelUrl}" target="_blank" class="btn btn-ghost btn-sm">📦 Shipping Label</a>` : ''}
        </div>`;
    document.getElementById('orderModal').classList.remove('hidden');
}

function closeModal() { document.getElementById('orderModal').classList.add('hidden'); }
document.getElementById('orderModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

function productLabel(val) {
    return { tshirt_regular: 'T-Shirt Regular 180GSM', tshirt_oversized: 'T-Shirt Oversized 220GSM', hoodie: 'Hoodie 350GSM' }[val] || val;
}
function statusLabel(val) {
    return { pending:'Pending', confirmed:'Confirmed', production:'In Production', dispatched:'Dispatched', delivered:'Delivered', cancelled:'Cancelled' }[val] || val;
}
function fmtDate(ts) {
    if (!ts) return '—';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
}
</script>
</body>
</html>
